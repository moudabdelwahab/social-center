<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة المرور — مركز القيادة الاجتماعي</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark" style="width:42px;height:42px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px">س</div>
      <div><div class="t1">استعادة كلمة المرور</div><div class="t2">سنرسل رابط إعادة التعيين إلى بريدك</div></div>
    </div>
    <form id="forgot-form" novalidate>
      <div class="field"><label for="email">البريد الإلكتروني</label>
        <input class="input mono" id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required></div>
      <div class="auth-msg" id="forgot-msg" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">إرسال رابط الاستعادة</button>
    </form>
    <a class="auth-back" href="login.html">← العودة لتسجيل الدخول</a>
  </div>
</main>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase/config.js"></script>
<script src="../js/supabase/client.js"></script>
<script src="../js/supabase/auth.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/state.js"></script>
<script src="../js/modals.js"></script>
<script src="../js/auth-pages.js"></script>
</body>
</html>
