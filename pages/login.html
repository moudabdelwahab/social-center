<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — مركز القيادة الاجتماعي</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark" style="width:42px;height:42px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px">س</div>
      <div><div class="t1">مركز القيادة الاجتماعي</div><div class="t2">إدارة الحسابات والحملات من مكان واحد</div></div>
    </div>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">البريد الإلكتروني</label>
        <input class="input mono" id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required></div>
      <div class="field"><label for="password">كلمة المرور</label>
        <input class="input" id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required></div>
      <label class="auth-check"><input type="checkbox" name="remember" checked> تذكر هذه الجلسة على هذا الجهاز</label>
      <div class="auth-msg" id="login-msg" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">تسجيل الدخول</button>
    </form>
    <div class="auth-alt"><a href="forgot-password.html">نسيت كلمة المرور؟</a></div>
    <div class="auth-alt">ليس لديك حساب؟ <a href="signup.html"><b>إنشاء حساب جديد</b></a></div>
  </div>
</main>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase/config.js"></script>
<script src="../js/supabase/client.js"></script>
<script src="../js/supabase/auth.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/state.js"></script>
<script src="../js/modals.js"></script>
<script src="../js/auth-pages.js"></script>
</body>
</html>
