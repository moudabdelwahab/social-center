<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب — مركز القيادة الاجتماعي</title>
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark" style="width:42px;height:42px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px">س</div>
      <div><div class="t1">إنشاء حساب جديد</div><div class="t2">سيتم إنشاء مساحة عمل خاصة بك تلقائيًا</div></div>
    </div>
    <form id="signup-form" novalidate>
      <div class="field"><label for="fullname">الاسم الكامل <span class="req">*</span></label>
        <input class="input" id="fullname" name="fullname" placeholder="مثال: سارة الأحمد" autocomplete="name" required></div>
      <div class="field"><label for="email">البريد الإلكتروني <span class="req">*</span></label>
        <input class="input mono" id="email" name="email" type="email" placeholder="you@company.com" autocomplete="email" required></div>
      <div class="form-row">
        <div class="field"><label for="password">كلمة المرور <span class="req">*</span></label>
          <input class="input" id="password" name="password" type="password" placeholder="8 أحرف على الأقل" autocomplete="new-password" required></div>
        <div class="field"><label for="password2">تأكيد كلمة المرور <span class="req">*</span></label>
          <input class="input" id="password2" name="password2" type="password" placeholder="أعد الإدخال" autocomplete="new-password" required></div>
      </div>
      <label class="auth-check"><input type="checkbox" name="terms"> أوافق على <a href="#" onclick="return false">شروط الاستخدام</a> و<a href="#" onclick="return false">سياسة الخصوصية</a></label>
      <div class="auth-msg" id="signup-msg" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">إنشاء الحساب ومساحة العمل</button>
    </form>
    <div class="auth-alt">لديك حساب بالفعل؟ <a href="login.html"><b>تسجيل الدخول</b></a></div>
  </div>
</main>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase/config.js"></script>
<script src="../js/supabase/client.js"></script>
<script src="../js/supabase/auth.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/state.js"></script>
<script src="../js/modals.js"></script>
<script src="../js/auth-pages.js"></script>
</body>
</html>
